:root{
  --paper:#F7F5F0;--card:#FFFFFF;--ink:#1D2B2A;--muted:#586462;--line:#E3DED3;--soft:#EDE9E0;--input:#E1EEEC;
  --brand:#3F8A80;--brand-deep:#2F6B64;--brand-tint:#E1EEEC;--accent:#E27A2F;--accent-deep:#A04A12;--accent-tint:#FDEDE1;--ring-track:rgba(0,0,0,.08);
  --hero1:#2F6B64;--hero2:#1A3C38;--hero-ink:#F7F5F0;--bad:#B3261E;--bad-tint:#FCE8E6;--ok:#22645C;--ok-tint:#E1EEEC;
  --warn:#A04A12;--warn-tint:#FDEDE1;--month:#4A7DB5;--days:#8467B8;--times:#4A7DB5;
  --c-car:#E9A06B;--c-other:#9FB3B0;--c-tax:#A6CFC9;--c-keep:#F7F5F0;
  --shadow:0 1px 0 rgba(29,43,42,.05),0 10px 26px -16px rgba(29,43,42,.35);
  --display:"Outfit",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-look=light]){--paper:#0F1817;--card:#172322;--ink:#F4F2EC;--muted:#8FAAA6;--line:#263634;--soft:#22302F;--input:#24403D;
  --brand:#7FBDB4;--brand-deep:#A6CFC9;--brand-tint:#1F3533;--accent:#F0904A;--accent-deep:#F5A66B;--accent-tint:#3B2A1E;--ring-track:rgba(255,255,255,.12);
  --hero1:#2B4C48;--hero2:#13211F;--hero-ink:#F4F2EC;--bad:#F28B82;--bad-tint:#3A2422;--ok:#A6CFC9;--ok-tint:#1F3533;
  --warn:#F5A66B;--warn-tint:#3B2A1E;--month:#8AB4E0;--days:#B7A2DE;--times:#8AB4E0;
  --c-car:#E3A57A;--c-other:#9FB3B0;--c-tax:#3F8A80;--c-keep:#F4F2EC;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 26px -16px rgba(0,0,0,.85);color-scheme:dark}}
:root[data-look=dark]{--paper:#0F1817;--card:#172322;--ink:#F4F2EC;--muted:#8FAAA6;--line:#263634;--soft:#22302F;--input:#24403D;
  --brand:#7FBDB4;--brand-deep:#A6CFC9;--brand-tint:#1F3533;--accent:#F0904A;--accent-deep:#F5A66B;--accent-tint:#3B2A1E;--ring-track:rgba(255,255,255,.12);
  --hero1:#2B4C48;--hero2:#13211F;--hero-ink:#F4F2EC;--bad:#F28B82;--bad-tint:#3A2422;--ok:#A6CFC9;--ok-tint:#1F3533;
  --warn:#F5A66B;--warn-tint:#3B2A1E;--month:#8AB4E0;--days:#B7A2DE;--times:#8AB4E0;
  --c-car:#E3A57A;--c-other:#9FB3B0;--c-tax:#3F8A80;--c-keep:#F4F2EC;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 26px -16px rgba(0,0,0,.85);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.top h1{margin:0;font:600 28px/1.1 var(--display);letter-spacing:-.3px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.brand svg{width:24px;height:24px;flex:none}
@media (max-width:560px){.brand span{display:none}.top h1{font-size:26px}}
.banner{background:var(--brand-tint);color:var(--brand-deep);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px}
h2{font:600 22px/1.2 var(--display);margin:24px 0 10px;letter-spacing:-.2px}
h3{font:600 15px/1.3 var(--body);margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.neg{color:var(--bad)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums lining-nums}
.card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.screen.enter{animation:enter .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Home: where each euro of the year goes */
.hero{background:linear-gradient(155deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero .lab{display:flex;align-items:center;gap:8px;font-size:14px;opacity:.9}
.yr{background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:3px 11px;color:inherit;font-size:14px;font-weight:600}
.hero .big{font:600 52px/1.05 var(--display);letter-spacing:-1.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums lining-nums}
.hero .vs{font-size:14px;opacity:.85;margin:0 0 16px}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.12);gap:2px}
.split i{display:block;height:100%;transform-origin:0 50%}
.split .sf{background:#E9B49A}.split .sc{background:#A9C7BB}.split .sx{background:#8C9691}.split .sk{background:#F6F3EC}
.anim .split i{animation:grow 1s cubic-bezier(.2,.7,.2,1) both}.anim .split .sc{animation-delay:.12s}.anim .split .sx{animation-delay:.24s}.anim .split .sk{animation-delay:.36s}
.parts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 8px;margin-top:12px}
@media (min-width:560px){.parts{grid-template-columns:repeat(4,1fr)}}
.parts div{font-size:13px;opacity:.92}
.parts b{display:block;font:600 20px/1.2 var(--display);font-variant-numeric:tabular-nums lining-nums}
.parts i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
@media (min-width:720px){.hero{padding:24px 26px 20px}.hero .big{font-size:72px}}
/* line chart */
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.months{position:relative;height:18px;font-size:12px;color:var(--muted);margin-top:2px}
.months span{position:absolute;top:0;transform:translateX(-50%)}
.months span:first-child{transform:none}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.anim .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.3,.6,.2,1) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.anim .area{transform-origin:50% 100%;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .15s both}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.rank{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.rank:last-child{border-bottom:0}
.rank b{font:600 17px var(--display);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--brand);transform-origin:0 50%}
.bar i.c{background:var(--accent)}
.anim .bar i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.donut{display:flex;gap:16px;align-items:center}

      '<label class="f"><span>Rate per ' + un1() + '</span><div class="row2">' + inp("ov_rate1", ov.rate1 != null ? ov.rate1 : "", "num", ' placeholder="' + (pre[2] != null ? pre[2] : "none") + '"') + used(nf3.format(U.rate1)) + "</div></label>" +
      '<label class="f"><span>Up to this distance a tax year (blank = no limit)</span><div class="row2">' + inp("ov_limit", ov.limit != null ? ov.limit : "", "num", ' placeholder="' + (pre[3] != null ? pre[3] : "no limit") + '"') + used(U.limit != null ? nf0.format(U.limit) + " " + U.unit : "no limit") + "</div></label>" +
      '<label class="f"><span>Rate after that distance</span><div class="row2">' + inp("ov_rate2", ov.rate2 != null ? ov.rate2 : "", "num", ' placeholder="' + (pre[4] != null ? pre[4] : "none") + '"') + used(nf3.format(U.rate2)) + "</div></label>" +
      '<label class="f"><span>Profit the tax set-aside is based on</span><div class="row2">' + sel("ov_base", ["", "Real profit", "Mileage rate"], ov.base || "", "", ["Preset (" + pre[5] + ")", "Real profit", "Mileage rate"]) + used(U.base) + '</div><p class="hint">"Real profit" uses every cost you logged. "Mileage rate" uses the rate above instead of your Car costs. Not tax advice: ask which one you may use.</p></label>' +
      (U.rateCheck ? '<p class="hint neg">Check: the set-aside uses the mileage rate, but the rate is 0. Type a rate or pick Real profit.</p>' : "") +
      '<h3 style="margin-top:14px">Quarters for the tax set-aside</h3><p class="hint" style="margin:-4px 0 10px">Type them for one year; other years follow. Blank = the preset' + (U.country === "United States" ? " (IRS estimated-tax dates)." : U.country === "United Kingdom" ? " (tax year from April 6)." : U.country === "Australia" ? " (tax year from July 1)." : " (calendar quarters).") + " The mileage tier resets at the Q1 start.</p>" +
      [0, 1, 2, 3].map(function (i) { return '<div class="row2">' + field("Q" + (i + 1) + " starts", inp("qs" + i, (T.qstart || [])[i] || "", "date", ' placeholder="' + pre[6][i] + '"')) + field("Q" + (i + 1) + " reminder", inp("qr" + i, (T.qremind || [])[i] || "", "date")) + "</div>"; }).join("") +
      (U.qok ? "" : '<p class="hint neg">Check: each quarter must start after the one before, and each reminder after its quarter starts.</p>') +
      '<div class="btns"><button class="btn" type="submit">Save settings</button></div></form>';
  }
  function moreBackup() {
    return '<div class="card"><h3>Copy for the spreadsheet</h3><p class="muted small">Copies rows in the same column order as the tab. In the sheet, click the first empty cell of the first column and paste (values only).</p>' +
      '<div class="btns">' + [["shifts", "Shifts"], ["expenses", "Expenses"], ["payments", "Tax set-aside records"]].map(function (x) {
        return '<button class="btn sec" data-a="copy" data-v="' + x[0] + '">' + x[1] + "</button>"; }).join("") + "</div>" +
      '<div class="btns"><button class="btn sec" data-a="csv" data-v="shifts">Download Shifts as CSV</button><button class="btn sec" data-a="csv" data-v="expenses">Download Expenses as CSV</button></div></div>' +
      '<div class="card" style="margin-top:12px"><h3>Backup</h3><p class="muted small">Save a backup file now and then, and to move to a new phone or computer.</p><div class="btns">' +
      '<button class="btn" data-a="backup">Save a backup file</button><label class="btn sec">Restore from a file<input type="file" id="restore" accept=".json,application/json" hidden></label></div></div>' +
      (standalone() ? "" : '<div class="card" style="margin-top:12px"><h3>Install the app</h3><p class="muted small">Put it on your home screen or computer so it opens like a normal app, even with no signal.</p><div class="btns"><button class="btn" data-a="install">Install the app</button></div></div>') +
      '<div class="card" style="margin-top:12px"><h3>Start fresh</h3><div class="btns">' + (S.asOf ? '<button class="btn" data-a="clear-sample">Clear the sample and start my own</button>' : '<button class="btn sec" data-a="load-sample">Load the sample driver</button>') +
      '<button class="btn bad" data-a="wipe">Delete everything</button></div></div><p class="hint">Made by NeatgridDigital. Not made, sponsored or endorsed by any driving app. Mileage rates and the set-aside are a guide, not tax or accounting advice. Your data never leaves this device.</p>';
  }
  function moreHelp() {
    var u = un1();
    return '<div class="card"><h3>What the numbers mean</h3>' + [
      ["Earned", "App pay + tips in the app + cash tips."],
      ["Real profit", "Earned minus every cost you logged (car costs and other costs). What you really keep before tax."],
      ["Real profit per hour / per " + u, "Real profit ÷ hours, and ÷ distance, for the period shown."],
      ["Car cost per " + u, "Car costs ÷ distance. Compare it with your country's mileage rate."],
      ["Mileage figure", "Your distance × the mileage rate on Settings, with the tier (UK, Australia) applied per tax year."],
      ["Profit using the mileage rate", "Earned − mileage figure − other costs. The figure many tax offices let drivers use instead of real car costs. Both figures are always shown; neither is \"your tax\"."],
      ["Which app pays best", "Each app's profit per hour after car costs: (earned − distance × car cost per " + u + ") ÷ hours. Car costs are shared out by distance; other costs are not."],
      ["Best days and times", "Earned per hour before costs, by weekday and by the time a shift started."],
      ["Tax set-aside", "A savings habit: a share of each quarter's profit (real profit or mileage-rate profit, your choice in Settings). Record what you move to savings or pay, and each quarter shows Done, Due soon or Past due."]
    ].map(function (x) { return '<div class="stat" style="display:block"><b style="font-size:15px">' + x[0] + '</b><p class="small muted" style="margin:2px 0 0">' + x[1] + "</p></div>"; }).join("") + "</div>" +
      '<div class="card" style="margin-top:12px"><h3>Logging shifts</h3><p class="small muted" style="margin:0">One row per app per shift. Two apps at once: hours and distance on one row, pay on each. Typed hours or distance win over times or the odometer. Driving to the mechanic or a car wash: app "' + esc(C.OTHER_WORK) + '", distance only. A shift past midnight works (8:00 PM to 1:30 AM = 5.5 h). Keep the records your tax office asks for: many want the date, distance, purpose and odometer readings of each trip.</p></div>' +
      '<div class="card" style="margin-top:12px"><h3>Not tax advice</h3><p class="small muted" style="margin:0">For personal record-keeping only. Ask your tax office or accountant which method you can use and what share to put aside. Rates change, often once a year: check yours in Settings.</p></div>';
  }

  // ---------------------------------------------------------------- export (spreadsheet column order)
  var COLS = {
    shifts: ["date", "app", "start", "end", "hours", "pay", "tips", "cash", "dist", "odo1", "odo2", "trips", "note"],
    expenses: ["date", "cat", "amount", "share", "note"],
    payments: ["date", "year", "q", "amount", "note"]
  };
  function rows(k) { return S[k].map(function (r) { return COLS[k].map(function (c) { var v = r[c]; if (k === "expenses" && c === "share" && v != null) v = v + "%"; return v == null ? "" : String(v); }); }); }
  function tsv(k) { return rows(k).map(function (r) { return r.map(function (v) { return v.replace(/[\t\n]/g, " "); }).join("\t"); }).join("\n"); }
  function csv(k) { return [COLS[k].join(",")].concat(rows(k).map(function (r) { return r.map(function (v) { return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); })).join("\n"); }
  function download(name, text, type) { var b = new Blob([text], { type: type }), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

  // ---------------------------------------------------------------- sheets
  function sheet(html) { closeSheet(); var d = document.createElement("div"); d.className = "scrim"; d.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><button class="x" data-a="close-sheet" aria-label="Close">×</button>' + html + "</div>";
    document.body.appendChild(d); d.querySelector(".sheet").focus({ preventScroll: true }); }
  function closeSheet() { document.querySelectorAll(".scrim").forEach(function (s) { s.remove(); }); }

  // ---------------------------------------------------------------- actions
  function go(tab) { if (tab === "more") view.more = null; view.tab = tab; view.shown = 40; view.anim = true; closeSheet(); window.scrollTo(0, 0); render(); }
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-a]"); if (!t) { if (ev.target.classList.contains("scrim")) closeSheet(); return; }
    var a = t.dataset.a, v = t.dataset.v, id = t.dataset.id;
    if (a === "tab") go(v);
    else if (a === "load-sample") { S = clone(SAMPLE); save(); view.tab = "home"; view.anim = true; render(); toast("Sample driver loaded"); }
    else if (a === "clear-sample") { if (confirm("Clear the sample driver and start empty? Your settings, apps and categories stay.")) {
      var keep = S.settings, lists = { apps: S.apps, expCats: S.expCats }; S = blank(); S.settings = Object.assign(S.settings, keep, { biz: "", goal: null }); Object.assign(S, lists);
      save(); view.kind = "shift"; view.lf = "shifts"; view.tab = "add"; view.anim = true; closeSheet(); window.scrollTo(0, 0); render(); toast("Cleared. Log your first shift."); } }
    else if (a === "wipe") { if (confirm("Delete everything in this app on this device? Save a backup first if you need it.")) { S = blank(); save(); go("home"); } }
    else if (a === "close-sheet") closeSheet();
    else if (a === "lf") { view.tab = "log"; view.lf = v; view.lq = ""; view.shown = 40; view.anim = true; closeSheet(); window.scrollTo(0, 0); render(); }
    else if (a === "shift") shiftSheet(id);
    else if (a === "copy-shift") { var src = byId("shifts", id); view.pre = { date: today(), app: src.app, start: src.start, end: src.end, odo1: src.odo2 };
      view.tab = "add"; view.kind = "shift"; view.anim = true; closeSheet(); window.scrollTo(0, 0); render(); }
    else if (a === "del-shift") { if (confirm("Delete this shift?")) { drop("shifts", id); save(); closeSheet(); view.keep = true; render(); toast("Deleted"); } }
    else if (a === "add-kind") { view.tab = "add"; view.kind = v; view.anim = true; closeSheet(); window.scrollTo(0, 0); render(); }
    else if (a === "expense") expenseSheet(id);
    else if (a === "del-exp") { if (confirm("Delete this cost?")) { drop("expenses", id); save(); closeSheet(); view.keep = true; render(); toast("Deleted"); } }
    else if (a === "del-pay") { if (confirm("Delete this record?")) { drop("payments", id); save(); view.keep = true; render(); } }
    else if (a === "more") { view.tab = "more"; view.more = v; view.shown = 40; view.anim = true; closeSheet(); render(); window.scrollTo(0, 0); }
    else if (a === "show-more") { view.shown += 40; view.keep = true; render(); }
    else if (a === "copy") { var txt = tsv(v); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { toast("Copied " + pl(S[v].length, "row")); },
      function () { download(v + ".tsv", txt, "text/tab-separated-values"); }); }
    else if (a === "csv") download("gig-driver-" + v + ".csv", csv(v), "text/csv");
    else if (a === "install") {
      if (window.__bip) { var bip = window.__bip; window.__bip = null; bip.prompt(); bip.userChoice.then(function (r) { if (r.outcome === "accepted") { flag("installed"); render(); } }); }
      else installHelp(); }
    else if (a === "no-install") { flag("noInstall"); view.keep = true; render(); }
    else if (a === "backup") { download("gig-driver-backup-" + realToday() + ".json", JSON.stringify(S), "application/json"); toast("Backup saved"); }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeSheet();
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches('div[role="button"][data-a]')) { ev.preventDefault(); ev.target.click(); } });
  var pvT = null;
  function livePreview(el) {
    clearTimeout(pvT); pvT = setTimeout(function () { var pv = document.getElementById("prev"); if (!pv || !document.body.contains(el)) return;
      var f = form(el);
      if (el.id === "shiftf") { var base = el.dataset.new ? { id: el.dataset.id } : clone(byId("shifts", el.dataset.id)); pv.innerHTML = shiftPreview(shiftFrom(f, base)); }
      else if (el.id === "expf") pv.innerHTML = expPreview({ id: el.dataset.id, date: f.date || today(), cat: f.cat, amount: N(f.amount), share: N(f.share), note: f.note || "" }); }, 120);
  }
  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.id === "lq") { view.lq = t.value; var pos = t.selectionStart; view.keep = true; render(); var m = document.getElementById("lq"); m.focus(); m.setSelectionRange(pos, pos); }
    else if (t.closest("#shiftf") || t.closest("#expf")) livePreview(t.closest("form"));
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "pyear") { S.year = t.value ? +t.value : null; save(); view.anim = true; view.keep = true; render(); }
    else if (t.id === "pper") { S.period = t.value; save(); view.anim = true; view.keep = true; render(); }
    else if (t.id === "restore") { var file = t.files[0]; if (!file) return; var rd = new FileReader();
      rd.onload = function () { try { var x = JSON.parse(rd.result); if (!x.settings || !Array.isArray(x.shifts)) throw 0; S = Object.assign(blank(), x); save(); view.anim = true; render(); toast("Backup restored"); }
        catch (e) { toast("That file isn't a " + SHORT + " backup"); } }; rd.readAsText(file); }
    else if (t.closest("#shiftf") || t.closest("#expf")) livePreview(t.closest("form"));
  });
  document.addEventListener("submit", function (ev) {
    ev.preventDefault(); var el = ev.target, f = form(el);
    if (el.id === "shiftf") {
      if (!f.date) { toast("Type the date"); return; }
      if (!(f.app || "").trim()) { toast("Pick the app"); return; }
      var isNew = !!el.dataset.new, base = isNew ? { id: el.dataset.id } : byId("shifts", el.dataset.id);
      var x = shiftFrom(f, base); upsert("shifts", x); sortDate("shifts"); S.lastApp = x.app; save(); closeSheet();
      var r = C.shiftRows(S, R.U, today()).filter(function (y) { return y.id === x.id; })[0];
      if (isNew) { view.tab = "log"; view.lf = "shifts"; view.lq = ""; view.anim = true; window.scrollTo(0, 0); } else view.keep = true;
      render(); toast(isNew ? (r && r.perHour != null ? "Added: " + money(r.earned) + ", " + money(r.perHour) + " an hour" : "Added") : "Saved"); }
    else if (el.id === "expf") { var ea = N(f.amount); if (ea == null) { toast("Type the amount"); return; }
      upsert("expenses", { id: el.dataset.id, date: f.date || today(), cat: f.cat, amount: ea, share: N(f.share), note: f.note || "" });
      sortDate("expenses"); save(); closeSheet();
      if (el.dataset.new) { view.tab = "log"; view.lf = "costs"; view.lq = ""; view.anim = true; window.scrollTo(0, 0); } else view.keep = true;
      render(); toast(el.dataset.new ? "Cost added" : "Saved"); }
    else if (el.id === "payf") { var pa = N(f.amount); if (pa == null) { toast("Type the amount"); return; }
      S.payments.push({ id: uid("t"), date: f.date || today(), year: N(f.year) || R.dash.taxyear, q: f.q, amount: pa, note: f.note || "" }); save(); view.keep = true; render(); toast("Recorded"); }
    else if (el.id === "listf") { var al = lines(f.apps).filter(function (a) { return a !== C.OTHER_WORK; }); if (al.length) S.apps = al;
      var cl = lines(f.cats).map(function (l) { var p = l.split("|"); return { name: p[0].trim(), type: /^car$/i.test((p[1] || "").trim()) ? "Car" : "Other" }; }).filter(function (c) { return c.name; });
      if (cl.length) S.expCats = cl; save(); view.keep = true; render(); toast("Lists saved"); }
    else if (el.id === "setf") { var T0 = S.settings, tp = N(f.tax_pct), ov = {};
      if ((f.ov_label || "").trim()) ov.label = f.ov_label.trim();
      if (f.ov_unit) ov.unit = f.ov_unit; if (f.ov_base) ov.base = f.ov_base;
      ["rate1", "limit", "rate2"].forEach(function (k) { var n = N(f["ov_" + k]); if (n != null) ov[k] = n; });
      Object.assign(T0, { biz: f.biz || "", look: f.look, country: f.country, tax_pct: tp == null ? T0.tax_pct : tp / 100, goal: N(f.goal), ov: ov,
        qstart: [0, 1, 2, 3].map(function (i) { return f["qs" + i] || null; }), qremind: [0, 1, 2, 3].map(function (i) { return f["qr" + i] || null; }) });
      save(); view.keep = true; render(); toast("Settings saved"); }
  });

  // ---------------------------------------------------------------- start
  store.get(KEY).then(function (v) { S = v ? Object.assign(blank(), v) : blank(); render(); });
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__bip = e; });
  window.addEventListener("appinstalled", function () { window.__bip = null; flag("installed"); if (S) render(); });
  // New version: the new worker takes over, then the page reloads once so the update shows straight away.
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (r) { r.update(); }).catch(function () {});
  }
})();
